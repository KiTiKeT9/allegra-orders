name: order_scanner
description: QR Code Scanner and Order Manager
publish_to: 'none'
version: 1.0.6+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.6
    mobile_scanner: ^4.0.0
    image_picker: ^1.0.7
    http: ^1.2.0
    provider: ^6.1.1
    permission_handler: ^11.2.0
    shared_preferences: ^2.2.2
    package_info_plus: ^8.0.0
    url_launcher: ^6.2.0
    dio: ^5.4.0
    video_compress: ^3.1.2
    path_provider: ^2.1.0
    path: ^1.8.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.1

flutter:
    uses-material-design: true
    assets:
        - assets/logo.png
